[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jfx-technical-rag"
version = "0.1.0"
description = "Offline lexical RAG pilot for jfxai4arch"
requires-python = ">=3.11"
dependencies = [
  "llama-index-core>=0.14,<0.15",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
observability = ["langfuse>=4,<5"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["jfx_rag*"]
